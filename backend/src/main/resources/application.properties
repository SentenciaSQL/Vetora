spring.application.name=animalin-api
spring.config.import=optional:file:./application-secrets.properties
spring.messages.basename=i18n/messages
spring.messages.fallback-to-system-locale=false
spring.messages.encoding=UTF-8
lemonsqueezy.api-key=${LEMON_SQUEEZY_API_KEY:}
lemonsqueezy.store-id=${LEMON_SQUEEZY_STORE_ID:}
lemonsqueezy.webhook-secret=${LEMON_SQUEEZY_WEBHOOK_SECRET:}
lemonsqueezy.test-mode=${LEMON_SQUEEZY_TEST_MODE:false}
lemonsqueezy.variants.basic-monthly=${LEMON_SQUEEZY_VARIANT_BASIC_MONTHLY:}
lemonsqueezy.variants.basic-annual=${LEMON_SQUEEZY_VARIANT_BASIC_ANNUAL:}
lemonsqueezy.variants.professional-monthly=${LEMON_SQUEEZY_VARIANT_PROFESSIONAL_MONTHLY:}
lemonsqueezy.variants.professional-annual=${LEMON_SQUEEZY_VARIANT_PROFESSIONAL_ANNUAL:}
lemonsqueezy.variants.premium-monthly=${LEMON_SQUEEZY_VARIANT_PREMIUM_MONTHLY:}
lemonsqueezy.variants.premium-annual=${LEMON_SQUEEZY_VARIANT_PREMIUM_ANNUAL:}
