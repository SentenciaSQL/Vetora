spring:
  application:
    name: animalin-api
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/animalin}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

animalin:
  jwt:
    secret: "animalin-dev-change-me-please-use-a-256-bit-secret-key!!"
    access-token-minutes: 30
    refresh-token-days: 14
  storage:
    provider: local
    local-path: ${user.home}/.animalin/uploads
    public-base-url: http://localhost:8080/api/v1/files
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:8080
      - http://127.0.0.1:4200
      - http://localhost:8081
      - http://10.0.2.2:8080
  fcm:
    enabled: false
  clinic:
    default-locale: es
    default-timezone: Europe/Madrid

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.animalin: INFO
    org.springframework.security: INFO

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
