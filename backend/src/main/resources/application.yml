spring:
  application:
    name: animalin-api
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  messages:
    basename: i18n/messages
    encoding: UTF-8
    fallback-to-system-locale: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/animalin}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    encoding: UTF-8
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never

animalin:
  jwt:
    secret: ${JWT_SECRET:animalin-dev-change-me-please-use-a-256-bit-secret-key!!}
    access-token-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
    refresh-token-hours: ${JWT_REFRESH_TOKEN_EXPIRATION_HOURS:8}
  session:
    inactivity-timeout-minutes: ${SESSION_INACTIVITY_TIMEOUT_MINUTES:30}
    warning-before-minutes: ${SESSION_WARNING_BEFORE_MINUTES:2}
    activity-heartbeat-minutes: ${SESSION_ACTIVITY_HEARTBEAT_MINUTES:5}
  storage:
    provider: local
    local-path: ${user.home}/.animalin/uploads
    public-base-url: http://localhost:8080/api/v1/files
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:8080
      - http://127.0.0.1:4200
      - http://localhost:8081
      - http://10.0.2.2:8080
      - https://lunaveta.com
      - https://www.lunaveta.com
  fcm:
    enabled: ${FCM_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
  clinic:
    default-locale: es
    default-timezone: America/Santo_Domingo
  signup:
    trial-days: ${SIGNUP_TRIAL_DAYS:14}
    max-clinics-per-owner: ${SIGNUP_MAX_CLINICS_PER_OWNER:1}
    verification-hours: ${SIGNUP_VERIFICATION_HOURS:48}
    resend-cooldown-seconds: ${SIGNUP_RESEND_COOLDOWN_SECONDS:60}
    invite-days: ${SIGNUP_INVITE_DAYS:7}
    public-app-url: ${PUBLIC_APP_URL:${FRONTEND_URL:http://localhost:4200}}
  account-deletion:
    token-hours: ${ACCOUNT_DELETION_TOKEN_HOURS:24}
    unverified-retention-days: ${ACCOUNT_DELETION_UNVERIFIED_RETENTION_DAYS:30}

resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:LunaVeta <no-reply@lunaveta.com>}
  api-url: ${RESEND_API_URL:https://api.resend.com}

app:
  frontend-url: ${FRONTEND_URL:${PUBLIC_APP_URL:http://localhost:4200}}

billing:
  jobs:
    grace-period-enabled: ${BILLING_GRACE_PERIOD_JOB_ENABLED:true}
    grace-period-cron: ${BILLING_GRACE_PERIOD_CRON:0 5 0 * * *}

lemonsqueezy:
  api-key: ${LEMON_SQUEEZY_API_KEY:}
  store-id: ${LEMON_SQUEEZY_STORE_ID:}
  webhook-secret: ${LEMON_SQUEEZY_WEBHOOK_SECRET:}
  test-mode: ${LEMON_SQUEEZY_TEST_MODE:false}
  variants:
    basic-monthly: ${LEMON_SQUEEZY_VARIANT_BASIC_MONTHLY:}
    basic-annual: ${LEMON_SQUEEZY_VARIANT_BASIC_ANNUAL:}
    professional-monthly: ${LEMON_SQUEEZY_VARIANT_PROFESSIONAL_MONTHLY:}
    professional-annual: ${LEMON_SQUEEZY_VARIANT_PROFESSIONAL_ANNUAL:}
    premium-monthly: ${LEMON_SQUEEZY_VARIANT_PREMIUM_MONTHLY:}
    premium-annual: ${LEMON_SQUEEZY_VARIANT_PREMIUM_ANNUAL:}
  products:
    basic: ${LEMON_SQUEEZY_PRODUCT_BASIC:}
    professional: ${LEMON_SQUEEZY_PRODUCT_PROFESSIONAL:}
    premium: ${LEMON_SQUEEZY_PRODUCT_PREMIUM:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.animalin: INFO
    org.springframework.security: INFO

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
billing:
  jobs:
    grace-period-enabled: false
lemonsqueezy:
  api-key: test-lemon-api-key
  store-id: "1"
  webhook-secret: test-lemon-webhook-secret
  test-mode: true
resend:
  api-key:
  from: LunaVeta <no-reply@lunaveta.com>
  api-url: https://api.resend.com
app:
  frontend-url: http://localhost:4200
