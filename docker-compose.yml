services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: animalin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - animalin_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DATABASE_URL: jdbc:postgresql://postgres:5432/animalin
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      ANIMALIN_JWT_SECRET: animalin-dev-change-me-please-use-a-256-bit-secret-key!!
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  animalin_pg:
